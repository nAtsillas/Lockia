<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-reasons" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="soft-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="20" fill="url(#bg-reasons)"/>

  <!-- Subtle Ambient Tech Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <circle cx="400" cy="300" r="160" fill="none" stroke-dasharray="6 6"/>
    <circle cx="400" cy="300" r="280" fill="none"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
  </g>

  <!-- Central Main Dashboard Card: Proven ROI & Performance -->
  <g transform="translate(140, 70)" filter="url(#card-shadow)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="520" height="310" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="2"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="520" height="55" rx="16" fill="#090d16"/>
    <rect x="0" y="45" width="520" height="10" fill="#090d16"/>
    
    <!-- Status Dots -->
    <circle cx="30" cy="28" r="5" fill="#ef4444"/>
    <circle cx="46" cy="28" r="5" fill="#f59e0b"/>
    <circle cx="62" cy="28" r="5" fill="#10b981"/>

    <text x="90" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">LOCKIA IMPACT &amp; ROI DASHBOARD</text>
    <rect x="400" y="16" width="95" height="24" rx="12" fill="#065f46"/>
    <text x="447" y="32" text-anchor="middle" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">● LIVE METRICS</text>

    <!-- Key Performance Stats (3 columns) -->
    <g transform="translate(30, 80)">
      <!-- Metric 1: Focus Gain -->
      <text x="0" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">PRODUCTIVITY GAIN</text>
      <text x="0" y="30" fill="#10b981" font-family="'Inter', sans-serif" font-size="28" font-weight="800">+48%</text>
      <text x="0" y="46" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Zero phone distractions</text>

      <!-- Metric 2: Incident Reduction -->
      <text x="170" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">THEFT / LIABILITY</text>
      <text x="170" y="30" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="28" font-weight="800">0.0%</text>
      <text x="170" y="46" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">100% verified check-ins</text>

      <!-- Metric 3: User Satisfaction -->
      <text x="330" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">FACILITY RATING</text>
      <text x="330" y="30" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="28" font-weight="800">4.9 ★</text>
      <text x="330" y="46" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Loved by visitors &amp; staff</text>
    </g>

    <!-- Visual ROI Trend Chart -->
    <g transform="translate(30, 160)">
      <!-- Chart Area -->
      <path d="M0 100 L75 85 L150 70 L225 50 L300 40 L375 22 L460 5 L460 110 L0 110 Z" fill="url(#chart-grad)"/>
      <path d="M0 100 L75 85 L150 70 L225 50 L300 40 L375 22 L460 5" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>

      <!-- Chart Data Nodes -->
      <circle cx="75" cy="85" r="4" fill="#10b981"/>
      <circle cx="150" cy="70" r="4" fill="#10b981"/>
      <circle cx="225" cy="50" r="4" fill="#10b981"/>
      <circle cx="300" cy="40" r="4" fill="#10b981"/>
      <circle cx="375" cy="22" r="4" fill="#10b981"/>
      <circle cx="460" cy="5" r="6" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
      
      <!-- Chart Axis Base Line -->
      <line x1="0" y1="110" x2="460" y2="110" stroke="#334155" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Floating Feature Card 1: Plug & Play Deployment (Left) -->
  <g transform="translate(60, 410)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="205" height="135" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="36" y="42" text-anchor="middle" font-size="16">⚡</text>
    <text x="66" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Turnkey Setup</text>
    <text x="66" y="47" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Plug &amp; Play Ready</text>
    <text x="18" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Standard wall power &amp; instant standalone operation with zero headaches.</text>
    <circle cx="185" cy="24" r="3" fill="#06b6d4" filter="url(#soft-glow)"/>
  </g>

  <!-- Floating Feature Card 2: Eliminates Theft & Risk (Center) -->
  <g transform="translate(295, 410)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="210" height="135" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="36" y="42" text-anchor="middle" font-size="16">🛡️</text>
    <text x="66" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Zero Liability</text>
    <text x="66" y="47" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Tamper-Proof Audit</text>
    <text x="18" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Automated electronic records free staff from overseeing personal belongings.</text>
    <circle cx="190" cy="24" r="3" fill="#10b981" filter="url(#soft-glow)"/>
  </g>

  <!-- Floating Feature Card 3: Premium Value Amenity (Right) -->
  <g transform="translate(535, 410)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="205" height="135" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="36" y="42" text-anchor="middle" font-size="16">💎</text>
    <text x="66" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Modern Amenity</text>
    <text x="66" y="47" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Attract &amp; Retain</text>
    <text x="18" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Boost member and guest satisfaction by offering secure, reliable smart custody.</text>
    <circle cx="185" cy="24" r="3" fill="#f59e0b" filter="url(#soft-glow)"/>
  </g>
</svg>