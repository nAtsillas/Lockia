<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="100%" height="100%">
  <defs>
    <linearGradient id="sym-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="sym-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="820" height="620" rx="24" fill="url(#sym-bg)"/>

  <!-- Subtle Decorative Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="410" y1="30" x2="410" y2="590"/>
    <line x1="30" y1="310" x2="790" y2="310"/>
    <circle cx="410" cy="310" r="160" fill="none" stroke-dasharray="6 6"/>
    <circle cx="410" cy="310" r="280" fill="none"/>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <path d="M 795 50 L 795 25 L 770 25" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <path d="M 25 570 L 25 595 L 50 595" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <path d="M 795 570 L 795 595 L 770 595" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>

  <!-- =======================================================================
       1. SEGURIDAD (Top-Left)
       ======================================================================= -->
  <g transform="translate(50, 45)" filter="url(#sym-shadow)">
    <rect x="0" y="0" width="340" height="240" rx="18" fill="#162238" stroke="#2a3c5a" stroke-width="1.8"/>
    <!-- Icon Box -->
    <rect x="22" y="20" width="58" height="58" rx="14" fill="#090f1d" stroke="#06b6d4" stroke-width="2"/>
    <path d="M51 32 L64 38 C64 53 51 63 51 63 C51 63 38 53 38 38 Z" fill="url(#teal-grad)"/>
    <path d="M46 47 L50 51 L57 43" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Title & Badge -->
    <text x="94" y="44" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800">1. Seguridad</text>
    <text x="94" y="66" fill="#06b6d4" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">CUSTODIA CERTIFICADA</text>

    <!-- Wrapped Body Text -->
    <text x="24" y="112" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">
      <tspan x="24" dy="0">Acero electrostático reforzado,</tspan>
      <tspan x="24" dy="18">compuertas antipalanca y bloqueo</tspan>
      <tspan x="24" dy="18">temporizado de máxima seguridad.</tspan>
    </text>

    <!-- Bottom Pill Badge -->
    <rect x="24" y="182" width="135" height="28" rx="14" fill="#06b6d4" fill-opacity="0.16" stroke="#06b6d4" stroke-opacity="0.3"/>
    <text x="91" y="200" text-anchor="middle" fill="#38bdf8" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">PROTECCIÓN TOTAL</text>
  </g>

  <!-- =======================================================================
       2. COMODIDAD (Top-Right) - Sin funcionalidad de carga
       ======================================================================= -->
  <g transform="translate(430, 45)" filter="url(#sym-shadow)">
    <rect x="0" y="0" width="340" height="240" rx="18" fill="#162238" stroke="#2a3c5a" stroke-width="1.8"/>
    <!-- Icon Box: Tarjeta RFID y acceso ágil (sin rayos ni carga) -->
    <rect x="22" y="20" width="58" height="58" rx="14" fill="#090f1d" stroke="#38bdf8" stroke-width="2"/>
    <rect x="36" y="36" width="30" height="20" rx="4" fill="none" stroke="url(#blue-grad)" stroke-width="2.2"/>
    <line x1="36" y1="42" x2="66" y2="42" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="43" cy="49" r="2.2" fill="#38bdf8"/>

    <!-- Title & Badge -->
    <text x="94" y="44" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800">2. Comodidad</text>
    <text x="94" y="66" fill="#38bdf8" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">SIN FRICCIONES</text>

    <!-- Wrapped Body Text: Enfocado en acceso ágil, sin mención a carga -->
    <text x="24" y="112" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">
      <tspan x="24" dy="0">Apertura instantánea mediante tarjeta</tspan>
      <tspan x="24" dy="18">o código PIN personal, garantizando un</tspan>
      <tspan x="24" dy="18">acceso ergonómico, ágil y sin esperas.</tspan>
    </text>

    <!-- Bottom Pill Badge -->
    <rect x="24" y="182" width="135" height="28" rx="14" fill="#2563eb" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="91" y="200" text-anchor="middle" fill="#60a5fa" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">ACCESO ÁGIL</text>
  </g>

  <!-- =======================================================================
       3. PRACTICIDAD (Bottom-Left)
       ======================================================================= -->
  <g transform="translate(50, 325)" filter="url(#sym-shadow)">
    <rect x="0" y="0" width="340" height="240" rx="18" fill="#162238" stroke="#2a3c5a" stroke-width="1.8"/>
    <!-- Icon Box -->
    <rect x="22" y="20" width="58" height="58" rx="14" fill="#090f1d" stroke="#f59e0b" stroke-width="2"/>
    <rect x="38" y="36" width="11" height="11" rx="2" fill="url(#amber-grad)"/>
    <rect x="53" y="36" width="11" height="11" rx="2" fill="url(#amber-grad)"/>
    <rect x="38" y="51" width="11" height="11" rx="2" fill="url(#amber-grad)"/>
    <rect x="53" y="51" width="11" height="11" rx="2" fill="url(#amber-grad)"/>

    <!-- Title & Badge -->
    <text x="94" y="44" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800">3. Practicidad</text>
    <text x="94" y="66" fill="#f59e0b" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">MODULAR Y ESCALABLE</text>

    <!-- Wrapped Body Text -->
    <text x="24" y="112" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">
      <tspan x="24" dy="0">Módulos cúbicos de 5 huecos que</tspan>
      <tspan x="24" dy="18">se adaptan a paredes, vestíbulos y</tspan>
      <tspan x="24" dy="18">cualquier requerimiento de espacio.</tspan>
    </text>

    <!-- Bottom Pill Badge -->
    <rect x="24" y="182" width="135" height="28" rx="14" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.3"/>
    <text x="91" y="200" text-anchor="middle" fill="#fbbf24" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">FÁCIL GESTIÓN</text>
  </g>

  <!-- =======================================================================
       4. TECNOLOGÍA AVANZADA (Bottom-Right)
       ======================================================================= -->
  <g transform="translate(430, 325)" filter="url(#sym-shadow)">
    <rect x="0" y="0" width="340" height="240" rx="18" fill="#162238" stroke="#2a3c5a" stroke-width="1.8"/>
    <!-- Icon Box -->
    <rect x="22" y="20" width="58" height="58" rx="14" fill="#090f1d" stroke="#10b981" stroke-width="2"/>
    <rect x="39" y="37" width="24" height="24" rx="4" fill="url(#green-grad)"/>
    <circle cx="51" cy="49" r="4" fill="#090f1d"/>
    <line x1="51" y1="31" x2="51" y2="37" stroke="#34d399" stroke-width="2"/>
    <line x1="51" y1="61" x2="51" y2="67" stroke="#34d399" stroke-width="2"/>
    <line x1="33" y1="49" x2="39" y2="49" stroke="#34d399" stroke-width="2"/>
    <line x1="63" y1="49" x2="69" y2="49" stroke="#34d399" stroke-width="2"/>

    <!-- Title & Badge -->
    <text x="94" y="44" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800">4. Tecnología</text>
    <text x="94" y="66" fill="#10b981" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">SMART LOCK &amp; IOT</text>

    <!-- Wrapped Body Text -->
    <text x="24" y="112" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">
      <tspan x="24" dy="0">Indicadores LED en tiempo real,</tspan>
      <tspan x="24" dy="18">tarjetas de apertura para personal</tspan>
      <tspan x="24" dy="18">y registro automatizado de uso.</tspan>
    </text>

    <!-- Bottom Pill Badge -->
    <rect x="24" y="182" width="135" height="28" rx="14" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="91" y="200" text-anchor="middle" fill="#34d399" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">INNOVACIÓN IOT</text>
  </g>
</svg>