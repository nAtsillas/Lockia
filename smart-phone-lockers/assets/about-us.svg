<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-about" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="locker-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="glass-slot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" rx="20" fill="url(#bg-about)"/>

  <!-- Subtle Architecture Backdrop Pattern -->
  <g opacity="0.4" stroke="#cbd5e1" stroke-width="1.5">
    <circle cx="150" cy="120" r="90" fill="none" stroke-dasharray="4 4"/>
    <circle cx="680" cy="480" r="140" fill="none" stroke-dasharray="6 6"/>
    <line x1="100" y1="520" x2="700" y2="520" stroke-width="2"/>
    <line x1="80" y1="560" x2="720" y2="560"/>
  </g>

  <!-- Floating Ambient Decorative Shapes -->
  <circle cx="640" cy="140" r="70" fill="#dbeafe" opacity="0.6"/>
  <circle cx="120" cy="450" r="50" fill="#e0e7ff" opacity="0.5"/>

  <!-- Main Smart Locker Tower Graphic -->
  <g transform="translate(180, 80)" filter="url(#soft-shadow)">
    <!-- Tower Main Body -->
    <rect x="0" y="0" width="340" height="420" rx="14" fill="url(#locker-body)" stroke="#334155" stroke-width="2"/>

    <!-- Lockia Brand Bar -->
    <rect x="0" y="0" width="340" height="50" rx="14" fill="#090d16"/>
    <rect x="0" y="38" width="340" height="12" fill="#0f172a"/>
    <circle cx="35" cy="25" r="8" fill="#3b82f6"/>
    <text x="52" y="30" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="2">LOCKIA</text>
    <circle cx="310" cy="25" r="4" fill="#10b981"/>

    <!-- 6 Storage Cells Grid -->
    <!-- Row 1 -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="140" height="95" rx="8" fill="url(#glass-slot)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">01</text>
      <circle cx="120" cy="20" r="4" fill="#00f0ff"/>
      <!-- Smartphone inside -->
      <rect x="50" y="28" width="36" height="55" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <rect x="54" y="32" width="28" height="45" rx="3" fill="#38bdf8" opacity="0.6"/>
      <circle cx="68" cy="72" r="2" fill="#ffffff"/>
      <path d="M68 44 L64 54 L69 54 L66 64 L74 52 L69 52 Z" fill="#ffffff"/>
    </g>

    <g transform="translate(180, 65)">
      <rect x="0" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">02</text>
      <circle cx="120" cy="20" r="4" fill="#10b981"/>
      <text x="70" y="55" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="600">READY</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">03</text>
      <circle cx="120" cy="20" r="4" fill="#10b981"/>
      <text x="70" y="55" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="600">READY</text>
    </g>

    <g transform="translate(180, 175)">
      <rect x="0" y="0" width="140" height="95" rx="8" fill="url(#glass-slot)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">04</text>
      <circle cx="120" cy="20" r="4" fill="#00f0ff"/>
      <!-- Smartphone inside -->
      <rect x="50" y="28" width="36" height="55" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <rect x="54" y="32" width="28" height="45" rx="3" fill="#38bdf8" opacity="0.6"/>
      <circle cx="68" cy="72" r="2" fill="#ffffff"/>
      <path d="M68 44 L64 54 L69 54 L66 64 L74 52 L69 52 Z" fill="#ffffff"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 285)">
      <rect x="0" y="0" width="140" height="95" rx="8" fill="url(#glass-slot)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">05</text>
      <circle cx="120" cy="20" r="4" fill="#f59e0b"/>
      <text x="70" y="55" text-anchor="middle" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="600">IN USE</text>
    </g>

    <g transform="translate(180, 285)">
      <rect x="0" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="12" y="24" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">06</text>
      <circle cx="120" cy="20" r="4" fill="#10b981"/>
      <text x="70" y="55" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="600">READY</text>
    </g>

    <!-- Bottom Pedestal -->
    <rect x="15" y="395" width="310" height="15" rx="4" fill="#0f172a"/>
  </g>

  <!-- Interactive User Hand / Smartphone Storing Gesture Card (Floating Right) -->
  <g transform="translate(450, 260)" filter="url(#badge-glow)">
    <rect x="0" y="0" width="250" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#eff6ff"/>
    <path d="M45 35 L45 55 M38 48 L45 55 L52 48" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" fill="#0f172a" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Secure Deposit</text>
    <text x="80" y="58" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Fast PIN or Badge Tap</text>

    <!-- Progress / Charging Indicator -->
    <rect x="25" y="85" width="200" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="25" y="85" width="160" height="8" rx="4" fill="url(#accent-blue)"/>
    <text x="25" y="115" fill="#334155" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Smart Power Delivery</text>
    <text x="195" y="115" fill="#2563eb" font-family="'Inter', sans-serif" font-size="12" font-weight="700">80%</text>

    <!-- Mini status tags -->
    <rect x="25" y="130" width="85" height="26" rx="6" fill="#f0fdf4"/>
    <text x="67" y="147" text-anchor="middle" fill="#16a34a" font-family="'Inter', sans-serif" font-size="10" font-weight="600">⚡ Fast Charge</text>

    <rect x="120" y="130" width="85" height="26" rx="6" fill="#f8fafc"/>
    <text x="162" y="147" text-anchor="middle" fill="#475569" font-family="'Inter', sans-serif" font-size="10" font-weight="600">🔒 Anti-Theft</text>
  </g>

  <!-- Floating Badge: Trusted Innovation -->
  <g transform="translate(100, 160)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="160" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="30" cy="30" r="14" fill="#ecfdf5"/>
    <path d="M26 30 L29 33 L35 27" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="27" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Modular Design</text>
    <text x="54" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Expand Any Time</text>
  </g>
</svg>