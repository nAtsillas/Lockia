<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ph-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ph-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="ph-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#ph-bg)"/>
  
  <g opacity="0.4" stroke="#cbd5e1" stroke-width="1.5">
    <circle cx="160" cy="140" r="100" fill="none" stroke-dasharray="6 6"/>
    <circle cx="680" cy="460" r="120" fill="none" stroke-dasharray="6 6"/>
    <line x1="100" y1="520" x2="700" y2="520"/>
  </g>

  <!-- Central Card -->
  <g transform="translate(180, 110)" filter="url(#ph-shadow)">
    <rect x="0" y="0" width="440" height="380" rx="16" fill="url(#ph-card)" stroke="#334155" stroke-width="2"/>
    
    <!-- Header with Lockia Brand -->
    <rect x="0" y="0" width="440" height="60" rx="16" fill="#090d16"/>
    <rect x="0" y="48" width="440" height="12" fill="#090d16"/>
    <circle cx="35" cy="30" r="10" fill="url(#ph-teal)"/>
    <text x="56" y="36" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="2">LOCKIA</text>
    <rect x="300" y="18" width="115" height="24" rx="12" fill="#065f46"/>
    <text x="357" y="34" text-anchor="middle" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">● ESPACIO SEGURO</text>

    <!-- Placeholder illustration graphic -->
    <g transform="translate(40, 85)">
      <!-- Campus / Workspace Icon -->
      <rect x="0" y="0" width="170" height="190" rx="12" fill="#1e293b" stroke="#334155"/>
      <circle cx="85" cy="60" r="30" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
      <path d="M85 45 L98 55 L98 75 L72 75 L72 55 Z" fill="#06b6d4"/>
      <text x="85" y="115" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Centros Educativos</text>
      <text x="85" y="135" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Aulas sin distracciones</text>
      <rect x="35" y="152" width="100" height="20" rx="10" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="85" y="166" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="700">+100% ENFOQUE</text>

      <!-- Office / Camps Icon -->
      <rect x="190" y="0" width="170" height="190" rx="12" fill="#1e293b" stroke="#334155"/>
      <circle cx="275" cy="60" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <path d="M265 60 L273 68 L287 52" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <text x="275" y="115" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Empresas y Eventos</text>
      <text x="275" y="135" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Custodia certificada</text>
      <rect x="225" y="152" width="100" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="275" y="166" text-anchor="middle" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="700">0% INCIDENCIAS</text>
    </g>

    <text x="220" y="340" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="12" font-style="italic">
      [ Placeholder Sobre Nosotros — Lockia Smart Systems ]
    </text>
  </g>
</svg>