<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-features" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="pod-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="glass-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="feat-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>

    <filter id="pulse-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#bg-features)"/>

  <!-- Technical Dimension Guides -->
  <g opacity="0.3" stroke="#94a3b8" stroke-width="1">
    <line x1="50" y1="120" x2="750" y2="120" stroke-dasharray="4 4"/>
    <line x1="50" y1="480" x2="750" y2="480" stroke-dasharray="4 4"/>
    <circle cx="400" cy="300" r="230" fill="none" stroke-dasharray="5 5"/>
  </g>

  <!-- Exploded Smart Compartment Visualization (Center) -->
  <g transform="translate(240, 110)" filter="url(#feat-shadow)">
    <!-- Main Locker Cavity Frame -->
    <rect x="0" y="0" width="320" height="380" rx="18" fill="url(#pod-outer)" stroke="#334155" stroke-width="2.5"/>

    <!-- Door Bezel & Glass Window -->
    <rect x="18" y="18" width="284" height="344" rx="14" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <rect x="25" y="25" width="270" height="330" rx="12" fill="url(#glass-front)"/>

    <!-- Illuminated LED Perimeter Border -->
    <rect x="28" y="28" width="264" height="324" rx="10" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Status Indicator Bar at Top of Compartment -->
    <g transform="translate(45, 45)">
      <text x="0" y="14" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="800">BAY #07</text>
      <circle cx="215" cy="10" r="5" fill="#10b981" filter="url(#pulse-glow)"/>
      <text x="180" y="14" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">ACTIVE</text>
    </g>

    <!-- Smartphone Angled on Charging Cradle -->
    <g transform="translate(95, 110)">
      <!-- Soft Silicone Cradle Base -->
      <rect x="10" y="160" width="110" height="18" rx="6" fill="#334155"/>
      <rect x="20" y="172" width="90" height="6" rx="3" fill="#10b981"/>

      <!-- Phone Body -->
      <rect x="15" y="10" width="100" height="155" rx="16" fill="#0b0f19" stroke="#64748b" stroke-width="2"/>
      <!-- Screen -->
      <rect x="20" y="16" width="90" height="143" rx="12" fill="#1e293b"/>
      
      <!-- Lockia Screen UI -->
      <circle cx="65" cy="50" r="18" fill="#10b981" opacity="0.15"/>
      <path d="M65 38 L60 50 L66 50 L63 62 L71 48 L65 48 Z" fill="#10b981"/>
      <text x="65" y="80" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="700">CHARGING</text>
      <text x="65" y="98" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="18" font-weight="800">92%</text>
      <text x="65" y="118" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Super Fast PD 3.0</text>
      
      <!-- Qi Wireless Waves -->
      <path d="M40 148 C50 142 80 142 90 148" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M48 152 C55 147 75 147 82 152" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Braided 3-in-1 Charging Cable Assembly -->
    <g transform="translate(130, 310)">
      <path d="M30 0 Q30 20 15 20 Q0 20 0 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <rect x="18" y="-5" width="24" height="12" rx="3" fill="#64748b"/>
      <rect x="26" y="-10" width="8" height="6" rx="1" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Callout Tag 1: Intelligent Charging Hub (Left Top) -->
  <g transform="translate(40, 140)">
    <line x1="200" y1="35" x2="255" y2="160" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="255" cy="160" r="4" fill="#0284c7"/>
    <rect x="0" y="0" width="200" height="75" rx="12" fill="#ffffff" filter="url(#feat-shadow)"/>
    <rect x="12" y="12" width="30" height="30" rx="6" fill="#eff6ff"/>
    <text x="27" y="32" text-anchor="middle" font-size="16">⚡</text>
    <text x="50" y="27" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Universal Fast Charge</text>
    <text x="50" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">USB-C PD, Lightning & Qi</text>
    <text x="14" y="62" fill="#2563eb" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Adaptive Smart Voltage</text>
  </g>

  <!-- Callout Tag 2: Heavy-Duty Electrostatic Steel (Left Bottom) -->
  <g transform="translate(40, 370)">
    <line x1="200" y1="35" x2="245" y2="400" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="245" cy="400" r="4" fill="#0284c7"/>
    <rect x="0" y="0" width="200" height="75" rx="12" fill="#ffffff" filter="url(#feat-shadow)"/>
    <rect x="12" y="12" width="30" height="30" rx="6" fill="#f8fafc"/>
    <text x="27" y="32" text-anchor="middle" font-size="16">🛡️</text>
    <text x="50" y="27" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Hardened Enclosure</text>
    <text x="50" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Electrostatic Coated Steel</text>
    <text x="14" y="62" fill="#10b981" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Anti-Pry & Scratch-Proof</text>
  </g>

  <!-- Callout Tag 3: Smart Cloud & Solenoid Lock (Right Top) -->
  <g transform="translate(560, 140)">
    <line x1="0" y1="35" x2="-60" y2="160" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="-60" cy="160" r="4" fill="#0284c7"/>
    <rect x="0" y="0" width="200" height="75" rx="12" fill="#ffffff" filter="url(#feat-shadow)"/>
    <rect x="12" y="12" width="30" height="30" rx="6" fill="#eff6ff"/>
    <text x="27" y="32" text-anchor="middle" font-size="16">🔐</text>
    <text x="50" y="27" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Digital Solenoid Latches</text>
    <text x="50" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Instant PIN / RFID / Mobile</text>
    <text x="14" y="62" fill="#2563eb" font-family="'Inter', sans-serif" font-size="9" font-weight="600">500,000+ Cycle Tested</text>
  </g>

  <!-- Callout Tag 4: LED Guidance & Ventilation (Right Bottom) -->
  <g transform="translate(560, 370)">
    <line x1="0" y1="35" x2="-60" y2="380" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="-60" cy="380" r="4" fill="#0284c7"/>
    <rect x="0" y="0" width="200" height="75" rx="12" fill="#ffffff" filter="url(#feat-shadow)"/>
    <rect x="12" y="12" width="30" height="30" rx="6" fill="#f0fdf4"/>
    <text x="27" y="32" text-anchor="middle" font-size="16">💡</text>
    <text x="50" y="27" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="700">RGB Status Guidance</text>
    <text x="50" y="42" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Thermal Exhaust Channels</text>
    <text x="14" y="62" fill="#16a34a" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Zero Overheating Risk</text>
  </g>
</svg>