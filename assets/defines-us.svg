<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-defines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shield-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="url(#bg-defines)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <circle cx="400" cy="300" r="120" fill="none" stroke-dasharray="6 6"/>
    <circle cx="400" cy="300" r="220" fill="none" stroke-dasharray="8 8"/>
    <circle cx="400" cy="300" r="320" fill="none"/>
    <line x1="80" y1="300" x2="720" y2="300"/>
    <line x1="400" y1="80" x2="400" y2="520"/>
  </g>

  <!-- Glowing Nodes Connection Lines -->
  <g opacity="0.3" stroke="#00f0ff" stroke-width="1.5">
    <line x1="400" y1="300" x2="220" y2="180"/>
    <line x1="400" y1="300" x2="580" y2="180"/>
    <line x1="400" y1="300" x2="220" y2="420"/>
    <line x1="400" y1="300" x2="580" y2="420"/>
  </g>

  <!-- Central Security Shield Artwork -->
  <g transform="translate(400, 290)" filter="url(#shield-shadow)">
    <!-- Outer Shield Frame -->
    <path d="M0 -150 L110 -100 C110 30 60 120 0 160 C-60 120 -110 30 -110 -100 Z" fill="#0b1329" stroke="url(#shield-grad)" stroke-width="4"/>

    <!-- Inner Shield Glow -->
    <path d="M0 -130 L90 -90 C90 20 50 95 0 135 C-50 95 -90 20 -90 -90 Z" fill="#131e3d" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Padlock Graphic Inside Shield -->
    <!-- Shackle -->
    <path d="M-30 -30 C-30 -60 30 -60 30 -30 L30 -10 L-30 -10 Z" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" filter="url(#glow-cyan)"/>
    <!-- Padlock Body -->
    <rect x="-45" y="-10" width="90" height="75" rx="14" fill="url(#shield-grad)"/>
    <!-- Keyhole -->
    <circle cx="0" cy="20" r="9" fill="#0b1329"/>
    <polygon points="-4,22 4,22 6,42 -6,42" fill="#0b1329"/>
    <circle cx="0" cy="20" r="4" fill="#00f0ff"/>
  </g>

  <!-- Top-Left Pillar Card: Military-Grade Security -->
  <g transform="translate(90, 100)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M30 35 L33 38 L40 31" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Hardened Steel</text>
    <text x="65" y="47" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Anti-Pry Latches</text>
    <text x="20" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Reinforced body built to prevent physical tampering.</text>
    <circle cx="180" cy="25" r="3" fill="#06b6d4" filter="url(#glow-cyan)"/>
  </g>

  <!-- Top-Right Pillar Card: Frictionless Access -->
  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M28 35 C28 30 35 30 35 35 C35 40 42 40 42 35" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="65" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Instant Access</text>
    <text x="65" y="47" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">PIN / RFID / App</text>
    <text x="20" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Unlock within 2 seconds without queues or keys.</text>
    <circle cx="180" cy="25" r="3" fill="#3b82f6" filter="url(#glow-cyan)"/>
  </g>

  <!-- Bottom-Left Pillar Card: Intelligent Power -->
  <g transform="translate(90, 390)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <path d="M37 25 L31 35 L36 35 L33 45 L41 33 L36 33 Z" fill="#10b981"/>
    <text x="65" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Fast Smart Charge</text>
    <text x="65" y="47" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Surge Protected</text>
    <text x="20" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Optimal voltage delivery with thermal cutoff.</text>
    <circle cx="180" cy="25" r="3" fill="#10b981" filter="url(#glow-cyan)"/>
  </g>

  <!-- Bottom-Right Pillar Card: Modern Aesthetics -->
  <g transform="translate(510, 390)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="29" y="29" width="12" height="12" rx="2" stroke="#a855f7" stroke-width="2" fill="none"/>
    <text x="65" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Sleek Design</text>
    <text x="65" y="47" fill="#c084fc" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Architectural Fit</text>
    <text x="20" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Minimalist finish elevating modern interior aesthetics.</text>
    <circle cx="180" cy="25" r="3" fill="#a855f7" filter="url(#glow-cyan)"/>
  </g>
</svg>